plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url "https://github.com/Serilum/.maven/raw/maven/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
    // Traveler's Backpack (optional integration)
    maven { url "https://api.modrinth.com/maven" }
    // Trinkets — Patbox fork (optional integration)
    maven { url "https://maven.pb4.eu/release/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    api("com.terraformersmc:modmenu:18.0.0-alpha.7") { exclude(module: "fabric-api") }

    implementation "com.natamus.collective-ml:collective-fabric:${minecraft_display_version}-${collective_version}"
    compileOnly "com.natamus.collective-ml:collective:${minecraft_display_version}-${collective_version}"
    // Runtime collective jar (universal 8.22) — provides collective_common_fabric.* used by all current Serilum mods
    compileOnly files("${rootProject.projectDir}/libs/collective-26.1.2-8.22.jar")

    // Optional integrations — compile-only; not bundled, not required at runtime
    // Using local file refs for now; update to proper maven coords before upstream PR
    compileOnly files("C:/ModrinthApp/profiles/Fabric 26.1.2/mods/travelersbackpack-fabric-26.1.2-11.2.6.jar")
    compileOnly files("C:/ModrinthApp/profiles/Fabric 26.1.2/mods/trinkets-4.0.0-beta.1+26.1.jar")
}

loom {
    def aw = project(':Common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    // mixin {
    //    defaultRefmapName.set("${mod_id}.refmap.json")
    // }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant -> // , 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}